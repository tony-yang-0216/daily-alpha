# ============================================
# Daily Alpha — 晨報設定
# ============================================

# ─── 模型設定 ─────────────────────────────
# 第二層用 Gemini 2.5 Flash（免費額度較高）
# 免費額度較充裕，每次執行用 2 次
model: "gemini-2.5-flash"
max_output_tokens: 65536

# ─── 晨報參數 ─────────────────────────────
max_articles_in_report: 8
# 從 Step 1 的 30~40 篇中精選 8 篇
# 8 篇 × 每篇約 400 字（含初學者筆記）= 約 3000 字
# 加上 Daily Insight 400 字 → 總計約 3500 字 → 約 25 分鐘閱讀

# ─── 讀者背景 ─────────────────────────────
# 這段會直接傳給 AI，讓它知道該用什麼深度寫
reader_profile: |
  我是一個剛開始每天閱讀新聞的初學者。
  我對科技業有興趣（特別是AI、半導體和新科技），但不是專業人士。
  也想藉由閱讀新聞來慢慢了解全球經濟和金融市場，補足投資相關的知識。

  請用像朋友聊天一樣的口吻，不要用學術或金融報告的語氣。
  而這種專業術語、技術黑話、金融術語（像是本益比、殖利率、量化寬鬆等），需要清楚解釋。
  我希望透過每天讀晨報，逐漸建立對科技產業和全球經濟的基本理解。