name: Daily Alpha

on:
  # schedule:
  #   - cron: '0 23 * * *'   # 台灣時間 07:00（UTC 23:00），預留 GitHub 延遲緩衝
  workflow_dispatch:        # 可手動觸發

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Step 1 — 收集新聞
        run: uv run daily-alpha
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Step 2 — 產出晨報
        run: uv run morning-report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: 更新 index.md
        run: uv run publish

      - name: Commit & push docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "chore(pages): auto-publish $(date +'%Y-%m-%d %H:%M UTC')"
          git push
